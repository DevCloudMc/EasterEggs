plugins {
    id 'java'
    id 'com.diffplug.spotless' version '8.11.0'
}

group = 'ru.brainrtp'
version = '4.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
    mavenCentral()
    maven { url = 'https://repo.extendedclip.com/releases/' }
    maven { url = 'https://jitpack.io' }
}

dependencies {
    compileOnly 'io.papermc.paper:paper-api:26.3.build.253-stable'

    compileOnly 'org.projectlombok:lombok:1.18.48'
    annotationProcessor 'org.projectlombok:lombok:1.18.48'
    compileOnly 'org.spongepowered:configurate-hocon:4.2.0'

    compileOnly 'com.zaxxer:HikariCP:7.1.0'

    compileOnly 'me.clip:placeholderapi:2.12.3'

    compileOnly 'com.github.MilkBowl:VaultAPI:1.7.1'

    testImplementation 'org.junit.jupiter:junit-jupiter:6.1.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'org.xerial:sqlite-jdbc:3.54.1.0'
}

// tests run the plugin classes outside the server, so they need what the server provides
configurations {
    testImplementation.extendsFrom compileOnly
}

test {
    useJUnitPlatform()
}

processResources {
    filesMatching('plugin.yml') {
        expand(version: project.version)
    }
}

spotless {
    java {
        googleJavaFormat('2.0.0')
    }
}
